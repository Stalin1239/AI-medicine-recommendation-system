name: "Step 4 — Sync Model Back to Repo"

on:
  # Automatically runs after Step 3 (Accuracy Evaluation) passes
  workflow_run:
    workflows: ["Step 3 — Accuracy Evaluation"]
    types:
      - completed
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  sync-back:
    name: Commit & Push Updated Model to Repo
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    # Grant write permissions to push the new model back
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn

      # Run full pipeline again inside this job to produce the actual files
      - name: Step A — Validate Dataset
        run: python scripts/validate_dataset.py

      - name: Step B — Retrain Model
        run: python scripts/retrain_model.py

      - name: Step C — Evaluate Accuracy
        run: python scripts/test_accuracy.py

      # Configure git and commit the new model file back to the repo
      - name: Commit and Push New Model
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage all generated/updated files
          git add health_model_v2.pkl
          git add models/latest/health_model_v2.pkl || true
          git add models/version_metadata.json || true
          git add logs/accuracy_reports/ || true
          git add logs/training_logs/ || true

          # Only commit if there are actual changes
          if git diff --staged --quiet; then
            echo "No model changes detected. Skipping push."
          else
            git commit -m "Auto-MLOps: Retrained model & updated accuracy reports [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
            echo "[SUCCESS] Latest model pushed back to ${{ github.ref_name }}"
          fi
