name: MediOps Accuracy Evaluation

on:
  workflow_run:
    workflows: ["MediOps Model Retraining"]
    types:
      - completed
  workflow_dispatch:

jobs:
  accuracy:
    name: Run Accuracy & Threshold Tests
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v3

    - name: Set up Python 3.11 Runtime
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas scikit-learn

    - name: Run Accuracy Diagnostics
      run: |
        python scripts/test_accuracy.py

    - name: Upload Accuracy Reports
      uses: actions/upload-artifact@v3
      with:
        name: MLOps-accuracy-reports
        path: |
          logs/accuracy_reports/*.json
          models/version_metadata.json
        retention-days: 5
