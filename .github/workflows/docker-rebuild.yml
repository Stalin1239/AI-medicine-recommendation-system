name: "Step 5 — Docker Build Verification"

on:
  # Runs after the model sync completes successfully
  workflow_run:
    workflows: ["Step 4 — Sync Model Back to Repo"]
    types:
      - completed
  # Also trigger on pushes to main (non-CSV changes like code updates)
  push:
    branches: [ main, master ]
    paths:
      - 'main.py'
      - 'database.py'
      - 'requirements.txt'
      - 'Dockerfile'
  workflow_dispatch:

jobs:
  docker-build:
    name: Verify Docker Image Builds
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Main Application Image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: mediops-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report Build Success
        run: echo "[OK] Docker image mediops-app:latest built successfully."
