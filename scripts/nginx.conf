server {
    listen 80;
    server_name _; # Accepts any IP address or domain

    # Route requests to FastAPI
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve static files directly via Nginx (faster than FastAPI)
    location /static/ {
        alias /var/www/mediops/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Serve uploaded images/PDFs directly
    location /static/uploads/ {
        alias /var/www/mediops/static/uploads/;
        expires 30d;
    }
}
