<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediOps | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: transparent;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #0f172a;
        

        

        

        

        

        

        
            25% {
                transform: translate(30px, -30px) scale(1.05);
            }
            50% {
                transform: translate(-20px, 20px) scale(0.95);
            }
            75% {
                transform: translate(40px, 10px) scale(1.02);
            }
        }

        .container-auth {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .auth-box {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(14, 165, 233, 0.2);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1), inset 0 1px 1px rgba(255, 255, 255, 0.8);
            animation: slideIn 0.6s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-section h2 {
            font-size: 28px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #0ea5e9, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .auth-section p {
            color: #475569;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #0ea5e9;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 16px;
            background: #ffffff;
            border: 1px solid rgba(14, 165, 233, 0.3);
            color: #0f172a;
            border-radius: 12px;
            color: #0f172a;
            font-size: 14px;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        .form-group select option {
            background: #ffffff;
            color: #0f172a;
        }

        .form-group input::placeholder {
            color: #64748b;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #2563eb;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(0, 240, 255, 0.15);
        }

        .btn {
            width: 100%;
            padding: 13px 20px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0ea5e9, #3b82f6);
            color: white;
            box-shadow: 0 10px 25px rgba(14, 165, 233, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(34, 197, 82, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .remember-forgot a {
            color: #0ea5e9;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .remember-forgot a:hover {
            color: #06b6d4;
        }

        .checkbox {
            accent-color: #22c55e;
            cursor: pointer;
        }

        .remember-forgot label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0;
            color: #475569;
            cursor: pointer;
            font-size: 13px;
        }

        .social-login {
            margin-top: 25px;
        }

        .social-login p {
            text-align: center;
            color: #64748b;
            margin-bottom: 15px;
            font-size: 12px;
        }

        .social-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .social-btn {
            padding: 10px;
            background: #ffffff;
            border: 1px solid rgba(14, 165, 233, 0.3);
            color: #0f172a;
            border-radius: 10px;
            color: #0ea5e9;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .social-btn:hover {
            background: rgba(148, 163, 184, 0.2);
            border-color: rgba(148, 163, 184, 0.5);
            transform: translateY(-1px);
        }

        .toggle-form {
            text-align: center;
            color: #475569;
            margin-top: 20px;
            font-size: 13px;
        }

        .toggle-form a {
            color: #0ea5e9;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .toggle-form a:hover {
            color: #06b6d4;
        }

        .logo-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #0ea5e9, #3b82f6);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin-bottom: 15px;
            box-shadow: 0 10px 30px rgba(34, 197, 82, 0.3);
        }

        .status-message {
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 13px;
            display: none;
        }

        .status-message.success {
            background: rgba(34, 197, 82, 0.1);
            border: 1px solid rgba(34, 197, 82, 0.3);
            color: #86efac;
            display: block;
        }

        .status-message.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            display: block;
        }

        .password-toggle {
            position: relative;
        }

        .password-toggle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #475569;
            cursor: pointer;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .password-toggle-btn:hover {
            color: #0ea5e9;
        }

        .navbar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .navbar-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #0f172a;
            font-size: 20px;
            font-weight: 700;
        }

        .navbar-logo i {
            font-size: 24px;
            background: linear-gradient(135deg, #0ea5e9, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        @media (max-width: 768px) {
            .navbar {
                padding: 15px 20px;
            }

            .auth-box {
                padding: 30px 20px;
            }

            .container-auth {
                padding: 100px 15px 20px;
            }

            .auth-section h2 {
                font-size: 24px;
            }
        }
    
        /* CYBERPUNK BACKGROUND SYSTEM */
        .cyber-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -999;
            background-color: #ffffff;
            overflow: hidden;
            pointer-events: none;
        }

        .cyber-grid {
            position: absolute;
            width: 200%; height: 200%;
            top: -50%; left: -50%;
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.2) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: perspective(500px) rotateX(45deg);
            animation: grid-scroll 10s linear infinite;
        }

        @keyframes grid-scroll {
            0% { transform: perspective(500px) rotateX(45deg) translateY(0); }
            100% { transform: perspective(500px) rotateX(45deg) translateY(50px); }
        }

        .cyber-scanlines {
            position: absolute;
            width: 100%; height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0, 240, 255, 0.05) 50%,
                rgba(0, 240, 255, 0.05)
            );
            background-size: 100% 4px;
            z-index: 10;
        }

        /* HUD ELEMENTS */
        .cyber-hud {
            position: absolute;
            z-index: 15;
            padding: 20px;
        }
        .top-left { top: 0; left: 0; }
        .bottom-right { bottom: 0; right: 0; }

        .hud-text {
            color: #00f0ff;
            font-family: monospace;
            font-weight: bold;
            font-size: 0.8rem;
            letter-spacing: 2px;
            animation: blink 2s infinite;
        }
        .hud-bar {
            width: 150px; height: 3px;
            background: #00f0ff;
            margin-top: 5px;
            position: relative;
        }
        .hud-bar::after {
            content: ''; position: absolute; top: 0; right: -10px; width: 5px; height: 3px; background: #ff0055;
        }

        .hud-circle {
            width: 100px; height: 100px;
            border: 1px dashed rgba(0, 240, 255, 0.5);
            border-radius: 50%;
            animation: rotate-slow 15s linear infinite;
            display: flex; align-items: center; justify-content: center;
        }
        .hud-crosshair {
            width: 20px; height: 20px;
            border: 2px solid #ff0055;
            border-radius: 50%;
        }

        @keyframes blink { 0%, 96%, 98% { opacity: 1; } 97%, 99% { opacity: 0; } }
        @keyframes rotate-slow { 100% { transform: rotate(360deg); } }

        /* FLOATING MEDICAL EQUIPMENT */
        .floating-equip {
            position: absolute;
            filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.4));
        }
        .equip-tablet {
            top: 15%; right: 15%;
            animation: float-obj 12s ease-in-out infinite, rotate-3d 20s linear infinite;
        }
        .equip-syringe {
            bottom: 20%; left: 10%;
            animation: float-obj 15s ease-in-out infinite reverse;
        }
        .equip-dna {
            top: 30%; left: 45%;
            animation: float-obj 18s ease-in-out infinite, rotate-dna 10s linear infinite;
        }

        @keyframes float-obj {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-30px); }
        }
        @keyframes rotate-3d {
            0% { transform: perspective(600px) rotateY(0deg) rotateX(10deg); }
            100% { transform: perspective(600px) rotateY(360deg) rotateX(10deg); }
        }
        @keyframes rotate-dna {
            100% { transform: rotateY(360deg); }
        }

        /* UI COMPONENT OVERRIDES (Cyberpunk Angle & Glitch) */
        .card, .auth-box, .sidebar, .form-card, .modal-content {
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 25px), calc(100% - 25px) 100%, 0 100%);
            border-bottom: 2px solid #00f0ff !important;
            border-right: 2px solid #00f0ff !important;
            background: rgba(255, 255, 255, 0.9) !important;
            box-shadow: 10px 10px 0px rgba(0, 240, 255, 0.1) !important;
        }

        button, .btn {
            position: relative;
            clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
            border-bottom: 2px solid #ff0055 !important;
            transition: all 0.2s;
        }

        button:hover, .btn:hover {
            animation: cyber-glitch 0.3s cubic-bezier(.25, .46, .45, .94) both infinite;
            background: #00f0ff !important;
            color: #050505 !important;
        }

        @keyframes cyber-glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 2px) }
            40% { transform: translate(-2px, -2px) }
            60% { transform: translate(2px, 2px) }
            80% { transform: translate(2px, -2px) }
            100% { transform: translate(0) }
        }

</style>
</head>
<body>
    
    
        <div class="blob blob2"></div>
        <div class="blob blob3"></div>
    </div>

    <nav class="navbar">
        <div class="navbar-logo">
            <i class="fa-solid fa-heart-pulse"></i>
            MediOps
        </div>
        <div class="flex items-center gap-4">
            <a href="/signup" class="text-sm text-blue-600 hover:text-blue-700 transition">Create Account</a>
            <a href="/" class="text-sm text-slate-600 hover:text-slate-800 transition flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i>
                Home
            </a>
        </div>
    </nav>

    <div class="container-auth">
        <div class="auth-box">
            <div class="auth-section">
                <div class="logo-section">
                    <div class="logo-icon">
                        <i class="fa-solid fa-sign-in-alt"></i>
                    </div>
                    <h2>Welcome Back</h2>
                    <p>Sign in to access your health profile</p>
                </div>

                <div class="status-message" id="loginStatus"></div>

                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label>Login As</label>
                        <select id="loginRole" class="form-control" required>
                            <option value="patient">Patient / User</option>
                            <option value="doctor">Medical Doctor</option>
                            <option value="admin">System Administrator</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="loginEmail" placeholder="your@email.com" required>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <div class="password-toggle">
                            <input type="password" id="loginPassword" placeholder="••••••••" required>
                            <button type="button" class="password-toggle-btn" onclick="togglePassword('loginPassword')">
                                <i class="fa-solid fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="remember-forgot">
                        <label>
                            <input type="checkbox" class="checkbox"> Remember me
                        </label>
                        <a href="#forgot">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn btn-primary">Sign In</button>

                    <div class="social-login">
                        <p>Or continue with</p>
                        <div class="social-buttons">
                            <button type="button" class="social-btn" onclick="loginWith('google')">
                                <i class="fa-brands fa-google"></i> Google
                            </button>
                            <button type="button" class="social-btn" onclick="loginWith('github')">
                                <i class="fa-brands fa-github"></i> GitHub
                            </button>
                        </div>
                    </div>
                </form>

                <div class="toggle-form">
                    Don't have an account? <a href="/signup">Sign up</a>
                </div>
                <div class="toggle-form" style="margin-top: 10px; font-size: 12px;">
                    Are you a medical professional? <a href="/doctor/login" style="color: #22c55e; font-weight: bold;">Doctor Portal Login</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function togglePassword(fieldId) {
            const field = document.getElementById(fieldId);
            const isPassword = field.type === 'password';
            field.type = isPassword ? 'text' : 'password';
        }

        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const role = document.getElementById('loginRole').value;
            const statusDiv = document.getElementById('loginStatus');

            // Show loading state
            statusDiv.className = 'status-message success';
            statusDiv.textContent = '⏳ Logging in...';

            // Send request to backend
            fetch('/api/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    email: email,
                    password: password,
                    role: role,
                }),
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    statusDiv.className = 'status-message success';
                    statusDiv.textContent = '✓ Login successful! Redirecting...';
                    const userId = data.token.split('_')[1] || '1';
                    localStorage.setItem('user_token', data.token);
                    localStorage.setItem('userId', userId);
                    if (role === 'doctor') {
                        localStorage.setItem('doctorId', userId);
                    } else if (role === 'patient') {
                        localStorage.setItem('patientId', userId);
                    }
                    if (data.user) {
                        localStorage.setItem('userName', data.user.full_name || 'Patient');
                        localStorage.setItem('userEmail', data.user.email || '');
                    }
                    setTimeout(() => {
                        if (role === 'doctor') {
                            window.location.href = '/doctor-dashboard';
                        } else if (role === 'admin') {
                            window.location.href = '/admin';
                        } else {
                            window.location.href = '/dashboard';
                        }
                    }, 1500);
                } else {
                    statusDiv.className = 'status-message error';
                    statusDiv.textContent = '✗ ' + (data.message || 'Login failed. Please try again.');
                }
            })
            .catch(error => {
                statusDiv.className = 'status-message error';
                statusDiv.textContent = '✗ Error: ' + error.message;
            });
        }

        function loginWith(provider) {
            alert(`Logging in with ${provider}...`);
            // Implement OAuth/social login
        }
    </script>
</body>
</html>
