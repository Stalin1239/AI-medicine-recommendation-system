<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MediOps Patient Login">
    <title>MediOps | Patient Login</title>
    <link rel="stylesheet" href="/static/mediops.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
    <style>
        .split-layout {
            display: flex;
            min-height: 100vh;
            width: 100%;
        }
        .panel-left {
            flex: 1;
            position: relative;
            background: url('https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?w=800') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            overflow: hidden;
        }
        .panel-left::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.8), rgba(255, 107, 157, 0.4));
            mix-blend-mode: multiply;
        }
        .panel-right {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            background: var(--bg-primary);
            position: relative;
        }
        .login-card {
            width: 100%;
            max-width: 440px;
            padding: 40px;
        }
        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .auth-header .logo-icon {
            margin: 0 auto 16px;
        }
        .auth-header h2 {
            font-family: var(--font-display);
            font-size: 24px;
            color: var(--text-primary);
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .auth-header p {
            color: var(--text-muted);
            margin-top: 8px;
            font-size: 14px;
        }
        .password-toggle { position: relative; }
        .password-toggle-btn {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--c-cyan);
            cursor: pointer;
            font-size: 14px;
        }
        .social-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 24px;
        }
        .hologram-content {
            position: relative;
            z-index: 10;
            color: white;
            text-align: center;
            max-width: 80%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: var(--radius-xl);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: var(--shadow-neon);
        }
        .hologram-content h1 {
            font-family: var(--font-display);
            font-size: 36px;
            margin-bottom: 16px;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.8);
        }
        .hologram-content p {
            font-size: 16px;
            opacity: 0.9;
            line-height: 1.6;
        }
        .nav-links {
            position: absolute;
            top: 20px;
            right: 40px;
            display: flex;
            gap: 20px;
            z-index: 100;
        }
        .nav-links a {
            color: var(--c-cyan-dark);
            text-decoration: none;
            font-family: var(--font-display);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: var(--transition);
        }
        .nav-links a:hover { color: var(--c-cyan); text-shadow: 0 0 10px rgba(0,212,255,0.5); }
        
        @media (max-width: 768px) {
            .split-layout { flex-direction: column; }
            .panel-left { display: none; }
            .nav-links { position: relative; top: 0; right: 0; justify-content: center; margin-bottom: 20px; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
    /* Font override — smooth Sora instead of blocky fonts */
    * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    .font-display, .cyber-label, .stat-label, .badge, .btn-neon,
    .logo-text, .section-title, .page-title, .topbar-title, .modal-title,
    .sidebar-user-name, .stat-value, h1, h2, h3, h4 {
        font-family: 'Sora', sans-serif !important;
        letter-spacing: normal !important;
    }
    </style>
</head>
<body>
    <div class="scanline-overlay"></div>
    
    <div class="split-layout">
        <!-- Left Panel: Hologram -->
        <div class="panel-left">
            <div class="heartbeat-line" style="position: absolute; top: 20%; width: 80%;">
                <svg viewBox="0 0 800 60"><path d="M0 30 L300 30 L320 10 L340 50 L360 30 L800 30" /></svg>
            </div>
            
            <div class="hologram-content">
                <div class="dna-spinner mb-24"></div>
                <h1>Intelligent Health</h1>
                <p>Access your AI-powered medical profile, track diagnoses, and connect with specialists instantly.</p>
            </div>
            
            <div class="heartbeat-line" style="position: absolute; bottom: 20%; width: 80%;">
                <svg viewBox="0 0 800 60"><path d="M0 30 L400 30 L420 10 L440 50 L460 30 L800 30" /></svg>
            </div>
        </div>

        <!-- Right Panel: Login Form -->
        <div class="panel-right">
            <div class="nav-links">
                <a href="/"><i class="fa-solid fa-home"></i> Home</a>
                <a href="/signup"><i class="fa-solid fa-user-plus"></i> Create Account</a>
                <a href="/doctor/login" class="text-coral"><i class="fa-solid fa-user-md"></i> Doctor Portal</a>
            </div>

            <div class="login-card glass-card">
                <div class="auth-header">
                    <a href="/" class="mediops-logo" style="justify-content: center;">
                        <div class="logo-icon"><i class="fa-solid fa-hospital"></i></div>
                        <div>
                            <div class="logo-text">MEDI<span>OPS</span></div>
                            <div class="logo-sub">Intelligent Health Platform</div>
                        </div>
                    </a>
                    <h2 class="mt-24">Sign In</h2>
                    <p>Access your health dashboard</p>
                </div>

                <div id="loginStatus" class="toast" style="display: none; position: relative; top: 0; right: 0; max-width: 100%; margin-bottom: 20px; animation: none;"></div>

                <form onsubmit="handleLogin(event)">
                    <div class="input-group">
                        <label class="cyber-label">Login As</label>
                        <select id="loginRole" class="cyber-select" required>
                            <option value="patient">Patient / User</option>
                            <option value="doctor">Medical Doctor</option>
                            <option value="admin">System Administrator</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label class="cyber-label">Email Address</label>
                        <i class="fa-solid fa-envelope input-icon"></i>
                        <input type="email" id="loginEmail" class="cyber-input with-icon" placeholder="your@email.com" required>
                    </div>

                    <div class="input-group">
                        <label class="cyber-label">Password</label>
                        <i class="fa-solid fa-lock input-icon"></i>
                        <div class="password-toggle">
                            <input type="password" id="loginPassword" class="cyber-input with-icon" placeholder="••••••••" required>
                            <button type="button" class="password-toggle-btn" onclick="togglePassword('loginPassword')">
                                <i class="fa-solid fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="flex justify-between items-center mb-24 text-sm font-display text-muted">
                        <label class="flex items-center gap-8 cursor-pointer">
                            <input type="checkbox" style="accent-color: var(--c-cyan);"> Remember me
                        </label>
                        <a href="#forgot" style="color: var(--c-cyan); text-decoration: none;">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn-neon btn-neon-cyan w-full" style="justify-content: center;">
                        Sign In <i class="fa-solid fa-arrow-right"></i>
                    </button>

                    <div class="mt-24 text-center">
                        <p class="cyber-label">Or continue with</p>
                        <div class="social-buttons">
                            <button type="button" class="btn-neon btn-neon-ghost" onclick="loginWith('google')" style="justify-content: center; padding: 10px;">
                                <i class="fa-brands fa-google"></i> Google
                            </button>
                            <button type="button" class="btn-neon btn-neon-ghost" onclick="loginWith('github')" style="justify-content: center; padding: 10px;">
                                <i class="fa-brands fa-github"></i> GitHub
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Floating Stickers JS
        (function() {
          const stickers = ['💊','🏥','🚑','🩺','🔬','💉','🧬','🫀','🩻','❤️','🌡️','🧪','💆','🏋️','⚕️'];
          const container = document.createElement('div');
          container.className = 'med-stickers-container';
          document.body.appendChild(container);
          function createSticker() {
            const s = document.createElement('div');
            s.className = 'med-sticker';
            s.textContent = stickers[Math.floor(Math.random() * stickers.length)];
            s.style.left = Math.random() * 100 + 'vw';
            s.style.fontSize = (20 + Math.random() * 24) + 'px';
            const dur = 12 + Math.random() * 20;
            s.style.animationDuration = dur + 's';
            s.style.animationDelay = Math.random() * 5 + 's';
            container.appendChild(s);
            setTimeout(() => s.remove(), (dur + 5) * 1000);
          }
          for (let i = 0; i < 8; i++) setTimeout(createSticker, i * 800);
          setInterval(createSticker, 2500);
        })();

        // Particles JS
        (function() {
          const pc = document.createElement('div');
          pc.className = 'particles-container';
          document.body.insertBefore(pc, document.body.firstChild);
          for (let i = 0; i < 20; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.bottom = '-10px';
            p.style.width = p.style.height = (2 + Math.random() * 4) + 'px';
            p.style.background = Math.random() > 0.5 ? '#00D4FF' : '#FF6B9D';
            p.style.animationDuration = (8 + Math.random() * 15) + 's';
            p.style.animationDelay = Math.random() * 10 + 's';
            pc.appendChild(p);
          }
        })();

        function togglePassword(fieldId) {
            const field = document.getElementById(fieldId);
            const isPassword = field.type === 'password';
            field.type = isPassword ? 'text' : 'password';
        }
        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const role = document.getElementById('loginRole').value;
            const statusDiv = document.getElementById('loginStatus');
            statusDiv.style.display = 'flex';
            statusDiv.className = 'toast info';
            statusDiv.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> ⏳ Logging in...';
            fetch('/api/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email, password, role}),
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    statusDiv.className = 'toast success';
                    statusDiv.innerHTML = '<i class="fa-solid fa-check-circle"></i> ✓ Login successful! Redirecting...';
                    const userId = data.token.split('_')[1] || '1';
                    localStorage.setItem('user_token', data.token);
                    localStorage.setItem('userId', userId);
                    if (role === 'doctor') localStorage.setItem('doctorId', userId);
                    else if (role === 'patient') localStorage.setItem('patientId', userId);
                    if (data.user) {
                        localStorage.setItem('userName', data.user.full_name || 'Patient');
                        localStorage.setItem('userEmail', data.user.email || '');
                    }
                    setTimeout(() => {
                        if (role === 'doctor') window.location.href = '/doctor-dashboard';
                        else if (role === 'admin') window.location.href = '/admin';
                        else window.location.href = '/dashboard';
                    }, 1500);
                } else {
                    statusDiv.className = 'toast error';
                    statusDiv.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> ✗ ' + (data.message || 'Login failed.');
                }
            })
            .catch(error => {
                statusDiv.className = 'toast error';
                statusDiv.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> ✗ Error: ' + error.message;
            });
        }
        function loginWith(provider) { alert(`Logging in with ${provider}...`); }
    </script>
    <script src="/static/cyber-inject.js"></script>
</body>
</html>
