<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MediOps Doctor Portal Login">
    <title>MediOps | Doctor Portal</title>
    <link rel="stylesheet" href="/static/mediops.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
    <style>
        .portal-layout {
            display: flex;
            min-height: 100vh;
            width: 100%;
            align-items: center;
            justify-content: center;
            background: var(--bg-primary);
            position: relative;
            padding: 20px;
        }
        .login-card {
            width: 100%;
            max-width: 480px;
            padding: 40px;
            position: relative;
            z-index: 10;
        }
        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .auth-header .logo-icon {
            margin: 0 auto 16px;
            background: var(--grad-coral);
            box-shadow: var(--shadow-coral);
            width: 64px;
            height: 64px;
            font-size: 32px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .auth-header h2 {
            font-family: var(--font-display);
            font-size: 28px;
            color: var(--text-primary);
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .auth-header p {
            color: var(--text-muted);
            margin-top: 8px;
            font-size: 14px;
        }
        .password-toggle { position: relative; }
        .password-toggle-btn {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--c-coral);
            cursor: pointer;
            font-size: 14px;
        }
        .nav-links {
            position: absolute;
            top: 20px;
            right: 40px;
            display: flex;
            gap: 20px;
            z-index: 100;
        }
        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-family: var(--font-display);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: var(--transition);
        }
        .nav-links a:hover { color: var(--c-cyan); }
        .demo-section {
            margin-top: 30px;
            padding-top: 24px;
            border-top: 1px dashed var(--border-light);
        }
        .demo-card {
            background: rgba(255,107,157,0.05);
            border: 1px solid rgba(255,107,157,0.2);
            border-radius: var(--radius-sm);
            padding: 12px;
            cursor: pointer;
            transition: var(--transition);
            text-align: left;
            width: 100%;
        }
        .demo-card:hover {
            background: rgba(255,107,157,0.1);
            border-color: rgba(255,107,157,0.4);
            transform: translateY(-2px);
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
    /* Font override — smooth Sora instead of blocky fonts */
    * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    .font-display, .cyber-label, .stat-label, .badge, .btn-neon,
    .logo-text, .section-title, .page-title, .topbar-title, .modal-title,
    .sidebar-user-name, .stat-value, h1, h2, h3, h4 {
        font-family: 'Sora', sans-serif !important;
        letter-spacing: normal !important;
    }
    </style>
</head>
<body>
    <div class="scanline-overlay"></div>
    
    <div class="portal-layout">
        <div class="nav-links">
            <a href="/"><i class="fa-solid fa-home"></i> Home</a>
            <a href="/login"><i class="fa-solid fa-arrow-left"></i> Patient Login</a>
        </div>
        
        <div class="login-card glass-card coral-accent">
            <div class="heartbeat-line" style="position: absolute; top: 0; left: 0; width: 100%; height: 40px; opacity: 0.5;">
                <svg viewBox="0 0 800 60"><path d="M0 30 L300 30 L320 10 L340 50 L360 30 L800 30" stroke="#FF6B9D" /></svg>
            </div>
            
            <div class="auth-header" style="margin-top: 20px;">
                <div class="logo-icon text-white"><i class="fa-solid fa-stethoscope"></i></div>
                <h2>Clinical Console</h2>
                <p>Doctor Command & Diagnostics Center</p>
            </div>

            <div id="statusMessage" class="toast" style="display: none; position: relative; top: 0; right: 0; max-width: 100%; margin-bottom: 20px; animation: none;"></div>

            <form onsubmit="handleDoctorLogin(event)">
                <div class="input-group">
                    <label class="cyber-label text-coral">Professional Email</label>
                    <i class="fa-solid fa-envelope input-icon text-coral"></i>
                    <input type="email" id="doctorEmail" class="cyber-input with-icon" style="border-color: rgba(255,107,157,0.3);" placeholder="physician@mediops.org" required>
                </div>

                <div class="input-group">
                    <label class="cyber-label text-coral">Access Token / Password</label>
                    <i class="fa-solid fa-key input-icon text-coral"></i>
                    <div class="password-toggle">
                        <input type="password" id="doctorPassword" class="cyber-input with-icon" style="border-color: rgba(255,107,157,0.3);" placeholder="••••••••" required>
                        <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility()">
                            <i id="passwordEye" class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-neon btn-neon-coral w-full mt-16" style="justify-content: center;">
                    Verify & Connect Portal <i class="fa-solid fa-unlock"></i>
                </button>
            </form>
            
            <div class="demo-section">
                <p class="cyber-label text-center mb-16">Demo Quick Fill Keys</p>
                <div class="grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                    <button class="demo-card" onclick="quickFill('dr.sarah@mediops.com', 'password123')">
                        <div class="font-display text-sm text-coral font-bold">Dr. Sarah Johnson</div>
                        <div class="text-xs text-muted font-mono mt-8">Dermatologist</div>
                    </button>
                    <button class="demo-card" onclick="quickFill('dr.ahmed@mediops.com', 'password123')">
                        <div class="font-display text-sm text-coral font-bold">Dr. Ahmed Hassan</div>
                        <div class="text-xs text-muted font-mono mt-8">Gastroenterologist</div>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Floating Stickers JS
        (function() {
          const stickers = ['🩺','🔬','💊','🏥','🧬','🫀','🩻'];
          const container = document.createElement('div');
          container.className = 'med-stickers-container';
          document.body.appendChild(container);
          function createSticker() {
            const s = document.createElement('div');
            s.className = 'med-sticker';
            s.textContent = stickers[Math.floor(Math.random() * stickers.length)];
            s.style.left = Math.random() * 100 + 'vw';
            s.style.fontSize = (24 + Math.random() * 30) + 'px';
            const dur = 15 + Math.random() * 20;
            s.style.animationDuration = dur + 's';
            s.style.animationDelay = Math.random() * 5 + 's';
            container.appendChild(s);
            setTimeout(() => s.remove(), (dur + 5) * 1000);
          }
          for (let i = 0; i < 6; i++) setTimeout(createSticker, i * 1000);
          setInterval(createSticker, 3000);
        })();

        // Particles JS
        (function() {
          const pc = document.createElement('div');
          pc.className = 'particles-container';
          document.body.insertBefore(pc, document.body.firstChild);
          for (let i = 0; i < 20; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.bottom = '-10px';
            p.style.width = p.style.height = (2 + Math.random() * 4) + 'px';
            p.style.background = Math.random() > 0.5 ? '#FF6B9D' : '#B24BF3';
            p.style.animationDuration = (8 + Math.random() * 15) + 's';
            p.style.animationDelay = Math.random() * 10 + 's';
            pc.appendChild(p);
          }
        })();

        function togglePasswordVisibility() {
            const passwordField = document.getElementById('doctorPassword');
            const eyeIcon = document.getElementById('passwordEye');
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordField.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }
        function quickFill(email, password) {
            document.getElementById('doctorEmail').value = email;
            document.getElementById('doctorPassword').value = password;
            showStatus('Demo Credentials Loaded. Ready to connect.', 'success');
        }
        function showStatus(msg, type) {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.style.display = 'flex';
            statusDiv.className = 'toast';
            if (type === 'error') {
                statusDiv.style.borderColor = '#FF4757';
                statusDiv.style.color = '#FF4757';
                statusDiv.style.background = 'rgba(255,71,87,0.08)';
                statusDiv.style.borderLeft = '4px solid #FF4757';
            } else {
                statusDiv.style.borderColor = '#00D4FF';
                statusDiv.style.color = '#00A8CC';
                statusDiv.style.background = 'rgba(0,212,255,0.08)';
                statusDiv.style.borderLeft = '4px solid #00D4FF';
            }
            statusDiv.innerHTML = (type === 'error' ? '<i class="fa-solid fa-triangle-exclamation mr-8"></i>' : '<i class="fa-solid fa-circle-check mr-8"></i>') + msg;
        }
        async function handleDoctorLogin(event) {
            event.preventDefault();
            const email = document.getElementById('doctorEmail').value;
            const password = document.getElementById('doctorPassword').value;
            showStatus('⏳ Verification in progress... Connecting to MediOps Mainframe.', 'success');
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, role: 'doctor' })
                });
                const data = await response.json();
                if (data.success) {
                    showStatus('✓ Secure link established! Transferring to Doctor Dashboard.', 'success');
                    const userId = data.token.split('_')[1] || '1';
                    localStorage.setItem('user_token', data.token);
                    localStorage.setItem('userId', userId);
                    localStorage.setItem('doctorId', userId);
                    if (data.user) {
                        localStorage.setItem('userName', data.user.full_name || 'Doctor');
                        localStorage.setItem('userEmail', data.user.email || '');
                    }
                    setTimeout(() => { window.location.href = '/doctor-dashboard'; }, 1500);
                } else {
                    showStatus(data.message || 'Verification failed. Credentials rejected.', 'error');
                }
            } catch (error) {
                showStatus('Connection failed: ' + error.message, 'error');
            }
        }
    </script>
    <script src="/static/cyber-inject.js"></script>
</body>
</html>
