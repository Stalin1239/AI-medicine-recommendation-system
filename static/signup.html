<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MediOps Create Account">
    <title>MediOps | Create Account</title>
    <link rel="stylesheet" href="/static/mediops.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
    <style>
        .split-layout {
            display: flex;
            min-height: 100vh;
            width: 100%;
        }
        .panel-left {
            flex: 1;
            position: relative;
            background: linear-gradient(135deg, var(--c-purple), var(--c-cyan));
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            overflow: hidden;
        }
        .panel-right {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            background: var(--bg-primary);
            position: relative;
        }
        .login-card {
            width: 100%;
            max-width: 440px;
            padding: 40px;
        }
        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .auth-header .logo-icon {
            margin: 0 auto 16px;
        }
        .auth-header h2 {
            font-family: var(--font-display);
            font-size: 24px;
            color: var(--text-primary);
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .auth-header p {
            color: var(--text-muted);
            margin-top: 8px;
            font-size: 14px;
        }
        .password-toggle { position: relative; }
        .password-toggle-btn {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--c-cyan);
            cursor: pointer;
            font-size: 14px;
        }
        .social-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 24px;
        }
        .stats-panel {
            position: relative;
            z-index: 10;
            color: white;
            text-align: center;
            max-width: 90%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: var(--radius-xl);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: var(--shadow-neon);
        }
        .stats-panel h1 {
            font-family: var(--font-display);
            font-size: 32px;
            margin-bottom: 32px;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.8);
        }
        .stat-item {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
            text-align: left;
        }
        .stat-icon {
            width: 48px;
            height: 48px;
            background: rgba(255,255,255,0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        .stat-text h3 {
            font-family: var(--font-display);
            font-size: 20px;
            margin: 0;
        }
        .stat-text p {
            font-size: 13px;
            opacity: 0.8;
            margin: 0;
        }
        .nav-links {
            position: absolute;
            top: 20px;
            right: 40px;
            display: flex;
            gap: 20px;
            z-index: 100;
        }
        .nav-links a {
            color: var(--c-cyan-dark);
            text-decoration: none;
            font-family: var(--font-display);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: var(--transition);
        }
        .nav-links a:hover { color: var(--c-cyan); text-shadow: 0 0 10px rgba(0,212,255,0.5); }
        
        @media (max-width: 768px) {
            .split-layout { flex-direction: column; }
            .panel-left { display: none; }
            .nav-links { position: relative; top: 0; right: 0; justify-content: center; margin-bottom: 20px; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
    /* Font override — smooth Sora instead of blocky fonts */
    * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    .font-display, .cyber-label, .stat-label, .badge, .btn-neon,
    .logo-text, .section-title, .page-title, .topbar-title, .modal-title,
    .sidebar-user-name, .stat-value, h1, h2, h3, h4 {
        font-family: 'Sora', sans-serif !important;
        letter-spacing: normal !important;
    }
    </style>
</head>
<body>
    <div class="scanline-overlay"></div>
    
    <div class="split-layout">
        <!-- Left Panel: Stats -->
        <div class="panel-left">
            <div class="stats-panel">
                <h1>Join the Revolution</h1>
                
                <div class="stat-item">
                    <div class="stat-icon"><i class="fa-solid fa-users"></i></div>
                    <div class="stat-text">
                        <h3>50K+ Patients</h3>
                        <p>Active users worldwide</p>
                    </div>
                </div>
                
                <div class="stat-item">
                    <div class="stat-icon"><i class="fa-solid fa-brain"></i></div>
                    <div class="stat-text">
                        <h3>99.2% Accuracy</h3>
                        <p>AI Diagnosis precision</p>
                    </div>
                </div>
                
                <div class="stat-item">
                    <div class="stat-icon"><i class="fa-solid fa-user-doctor"></i></div>
                    <div class="stat-text">
                        <h3>2000+ Doctors</h3>
                        <p>Verified medical professionals</p>
                    </div>
                </div>
                
                <div class="stat-item">
                    <div class="stat-icon"><i class="fa-solid fa-map-location-dot"></i></div>
                    <div class="stat-text">
                        <h3>45 Cities</h3>
                        <p>Global coverage</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Panel: Signup Form -->
        <div class="panel-right">
            <div class="nav-links">
                <a href="/"><i class="fa-solid fa-home"></i> Home</a>
                <a href="/login"><i class="fa-solid fa-sign-in-alt"></i> Back to Login</a>
            </div>

            <div class="login-card glass-card">
                <div class="auth-header">
                    <a href="/" class="mediops-logo" style="justify-content: center;">
                        <div class="logo-icon"><i class="fa-solid fa-user-plus"></i></div>
                        <div>
                            <div class="logo-text">MEDI<span>OPS</span></div>
                            <div class="logo-sub">Intelligent Health Platform</div>
                        </div>
                    </a>
                    <h2 class="mt-24">Create Account</h2>
                    <p>Join the future of healthcare</p>
                </div>

                <div id="signupStatus" class="toast" style="display: none; position: relative; top: 0; right: 0; max-width: 100%; margin-bottom: 20px; animation: none;"></div>

                <form onsubmit="handleSignup(event)">
                    <div class="input-group">
                        <label class="cyber-label">Full Name</label>
                        <i class="fa-solid fa-user input-icon"></i>
                        <input type="text" id="signupName" class="cyber-input with-icon" placeholder="John Doe" required>
                    </div>

                    <div class="input-group">
                        <label class="cyber-label">Email Address</label>
                        <i class="fa-solid fa-envelope input-icon"></i>
                        <input type="email" id="signupEmail" class="cyber-input with-icon" placeholder="your@email.com" required>
                    </div>

                    <div class="input-group">
                        <label class="cyber-label">Password</label>
                        <i class="fa-solid fa-lock input-icon"></i>
                        <div class="password-toggle">
                            <input type="password" id="signupPassword" class="cyber-input with-icon" placeholder="••••••••" required>
                            <button type="button" class="password-toggle-btn" onclick="togglePassword('signupPassword')">
                                <i class="fa-solid fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="input-group">
                        <label class="cyber-label">Confirm Password</label>
                        <i class="fa-solid fa-lock input-icon"></i>
                        <div class="password-toggle">
                            <input type="password" id="signupConfirmPassword" class="cyber-input with-icon" placeholder="••••••••" required>
                            <button type="button" class="password-toggle-btn" onclick="togglePassword('signupConfirmPassword')">
                                <i class="fa-solid fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="flex items-center mb-24 text-sm font-display text-muted">
                        <label class="flex items-center gap-8 cursor-pointer">
                            <input type="checkbox" required style="accent-color: var(--c-cyan);"> I agree to Terms & Conditions
                        </label>
                    </div>

                    <button type="submit" class="btn-neon btn-neon-purple w-full" style="justify-content: center;">
                        Create Account <i class="fa-solid fa-user-plus"></i>
                    </button>

                    <div class="mt-24 text-center">
                        <p class="cyber-label">Or sign up with</p>
                        <div class="social-buttons">
                            <button type="button" class="btn-neon btn-neon-ghost" onclick="signupWith('google')" style="justify-content: center; padding: 10px;">
                                <i class="fa-brands fa-google"></i> Google
                            </button>
                            <button type="button" class="btn-neon btn-neon-ghost" onclick="signupWith('github')" style="justify-content: center; padding: 10px;">
                                <i class="fa-brands fa-github"></i> GitHub
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Floating Stickers JS
        (function() {
          const stickers = ['💊','🏥','🚑','🩺','🔬','💉','🧬','🫀','🩻','❤️','🌡️','🧪','💆','🏋️','⚕️'];
          const container = document.createElement('div');
          container.className = 'med-stickers-container';
          document.body.appendChild(container);
          function createSticker() {
            const s = document.createElement('div');
            s.className = 'med-sticker';
            s.textContent = stickers[Math.floor(Math.random() * stickers.length)];
            s.style.left = Math.random() * 100 + 'vw';
            s.style.fontSize = (20 + Math.random() * 24) + 'px';
            const dur = 12 + Math.random() * 20;
            s.style.animationDuration = dur + 's';
            s.style.animationDelay = Math.random() * 5 + 's';
            container.appendChild(s);
            setTimeout(() => s.remove(), (dur + 5) * 1000);
          }
          for (let i = 0; i < 8; i++) setTimeout(createSticker, i * 800);
          setInterval(createSticker, 2500);
        })();

        // Particles JS
        (function() {
          const pc = document.createElement('div');
          pc.className = 'particles-container';
          document.body.insertBefore(pc, document.body.firstChild);
          for (let i = 0; i < 20; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.bottom = '-10px';
            p.style.width = p.style.height = (2 + Math.random() * 4) + 'px';
            p.style.background = Math.random() > 0.5 ? '#00D4FF' : '#FF6B9D';
            p.style.animationDuration = (8 + Math.random() * 15) + 's';
            p.style.animationDelay = Math.random() * 10 + 's';
            pc.appendChild(p);
          }
        })();

        function togglePassword(fieldId) {
            const field = document.getElementById(fieldId);
            const isPassword = field.type === 'password';
            field.type = isPassword ? 'text' : 'password';
        }
        function handleSignup(event) {
            event.preventDefault();
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('signupConfirmPassword').value;
            const statusDiv = document.getElementById('signupStatus');
            statusDiv.style.display = 'flex';
            
            if (password !== confirmPassword) {
                statusDiv.className = 'toast error';
                statusDiv.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> ✗ Passwords do not match';
                return;
            }
            if (password.length < 6) {
                statusDiv.className = 'toast error';
                statusDiv.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> ✗ Password must be at least 6 characters';
                return;
            }
            
            statusDiv.className = 'toast info';
            statusDiv.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> ⏳ Creating account...';
            fetch('/api/auth/signup', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({full_name: name, email, password}),
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    statusDiv.className = 'toast success';
                    statusDiv.innerHTML = '<i class="fa-solid fa-check-circle"></i> ✓ Account created! Redirecting to login...';
                    setTimeout(() => { window.location.href = '/login'; }, 1500);
                } else {
                    statusDiv.className = 'toast error';
                    statusDiv.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> ✗ ' + (data.message || 'Signup failed.');
                }
            })
            .catch(error => {
                statusDiv.className = 'toast error';
                statusDiv.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> ✗ Error: ' + error.message;
            });
        }
        function signupWith(provider) { alert(`Signing up with ${provider}...`); }
    </script>
    <script src="/static/cyber-inject.js"></script>
</body>
</html>
