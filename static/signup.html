<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediOps | Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: transparent; color: #0f172a;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        

        

        

        

        

        

        
            25% {
                transform: translate(30px, -30px) scale(1.05);
            }
            50% {
                transform: translate(-20px, 20px) scale(0.95);
            }
            75% {
                transform: translate(40px, 10px) scale(1.02);
            }
        }

        .container-auth {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .auth-box {
            background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(0,0,0,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            animation: slideIn 0.6s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-section h2 {
            font-size: 28px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #0ea5e9, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .auth-section p {
            color: #475569;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #0ea5e9;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: #ffffff;
            border: 1px solid rgba(148, 163, 184, 0.3);
            border-radius: 12px;
            color: #0f172a;
            font-size: 14px;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .form-group input::placeholder {
            color: #64748b;
        }

        .form-group input:focus {
            outline: none;
            border-color: #22c55e;
            background: #ffffff;
            box-shadow: 0 0 20px rgba(34, 197, 82, 0.2);
        }

        .btn {
            width: 100%;
            padding: 13px 20px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0ea5e9, #3b82f6);
            color: white;
            box-shadow: 0 10px 30px rgba(34, 197, 82, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(34, 197, 82, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .checkbox {
            accent-color: #22c55e;
            cursor: pointer;
        }

        .remember-forgot label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0;
            color: #475569;
            cursor: pointer;
            font-size: 13px;
        }

        .social-login {
            margin-top: 25px;
        }

        .social-login p {
            text-align: center;
            color: #64748b;
            margin-bottom: 15px;
            font-size: 12px;
        }

        .social-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .social-btn {
            padding: 10px;
            background: rgba(148, 163, 184, 0.1);
            border: 1px solid rgba(148, 163, 184, 0.3);
            border-radius: 10px;
            color: #0ea5e9;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .social-btn:hover {
            background: rgba(148, 163, 184, 0.2);
            border-color: rgba(148, 163, 184, 0.5);
            transform: translateY(-1px);
        }

        .toggle-form {
            text-align: center;
            color: #475569;
            margin-top: 20px;
            font-size: 13px;
        }

        .toggle-form a {
            color: #0ea5e9;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .toggle-form a:hover {
            color: #06b6d4;
        }

        .logo-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #0ea5e9, #3b82f6);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin-bottom: 15px;
            box-shadow: 0 10px 30px rgba(34, 197, 82, 0.3);
        }

        .status-message {
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 13px;
            display: none;
        }

        .status-message.success {
            background: rgba(34, 197, 82, 0.1);
            border: 1px solid rgba(34, 197, 82, 0.3);
            color: #86efac;
            display: block;
        }

        .status-message.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            display: block;
        }

        .password-toggle {
            position: relative;
        }

        .password-toggle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #475569;
            cursor: pointer;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .password-toggle-btn:hover {
            color: #0ea5e9;
        }

        .navbar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .navbar-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #0f172a;
            font-size: 20px;
            font-weight: 700;
        }

        .navbar-logo i {
            font-size: 24px;
            background: linear-gradient(135deg, #0ea5e9, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        @media (max-width: 768px) {
            .navbar {
                padding: 15px 20px;
            }

            .auth-box {
                padding: 30px 20px;
            }

            .container-auth {
                padding: 100px 15px 20px;
            }

            .auth-section h2 {
                font-size: 24px;
            }
        }
    
        
        /* DARK MEDICAL CYBERPUNK CSS GUIDE */
        :root {
          /* Deep Dark Backgrounds */
          --bg-base: #020617;       
          --bg-card: rgba(2, 6, 23, 0.7); 
          
          /* Neon Accents */
          --neon-primary: #00E5FF;  
          --neon-secondary: #0077FF; 
          
          /* Text Colors */
          --text-main: #FFFFFF;
          --text-muted: rgba(255, 255, 255, 0.5);
          
          /* Reusable Glowing Shadows (Using RGB of #00E5FF) */
          --glow-sm: 0 0 10px rgba(0, 229, 255, 0.3);
          --glow-md: 0 0 20px rgba(0, 229, 255, 0.5), 0 0 40px rgba(0, 229, 255, 0.2);
          --border-neon: rgba(0, 229, 255, 0.3);
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            position: relative;
        }

        /* Dark Moody Background Image */
        body::before {
          content: '';
          position: fixed;
          inset: 0;
          /* Using a high-quality dark medical/tech abstract image from Unsplash */
          background-image: url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?q=80&w=2070&auto=format&fit=crop');
          background-size: cover;
          background-position: center;
          
          /* CRITICAL: Darken heavily and boost colors */
          filter: brightness(0.15) saturate(1.8);
          
          z-index: -2; 
        }

        /* Subtle CRT Scanlines Overlay */
        body::after {
          content: '';
          position: fixed;
          inset: 0;
          background: repeating-linear-gradient(
            0deg,
            transparent,
            transparent 3px,
            rgba(0, 0, 0, 0.1) 3px,
            rgba(0, 0, 0, 0.1) 4px
          );
          pointer-events: none; 
          z-index: 9999;
        }

        /* Glassmorphism (Frosted Glass) for Cards */
        .glass-card, .card, .form-card, .auth-box, .sidebar, .modal-content {
          background: var(--bg-card) !important;
          backdrop-filter: blur(16px) saturate(180%) !important;
          -webkit-backdrop-filter: blur(16px) saturate(180%) !important;
          
          border: 1px solid var(--border-neon) !important;
          border-radius: 16px !important;
          box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5) !important;
          
          /* Remove clip-path from previous design */
          clip-path: none !important; 
        }

        /* Neon Glowing Text */
        .neon-heading, h1, h2, h3 {
          color: #FFF !important;
          font-weight: 800;
          text-shadow: 
            0 0 5px rgba(0, 229, 255, 0.8),
            0 0 20px rgba(0, 229, 255, 0.5),
            0 0 40px rgba(0, 229, 255, 0.3) !important;
        }

        /* Glowing Buttons */
        .cyber-button, button, .btn {
          background: transparent !important;
          color: var(--neon-primary) !important;
          border: 1px solid var(--neon-primary) !important;
          padding: 12px 24px;
          border-radius: 8px;
          text-transform: uppercase;
          letter-spacing: 2px;
          font-weight: bold;
          cursor: pointer;
          transition: all 0.3s ease;
          clip-path: none !important; /* Remove old cyberpunk clip */
        }
        
        .cyber-button:hover, button:hover, .btn:hover {
          background: var(--neon-primary) !important;
          color: var(--bg-base) !important;
          box-shadow: var(--glow-md) !important;
          transform: translateY(-2px);
          animation: none !important; /* Remove glitch */
        }

        /* Floating Medical Equipment (Particles Effect) */
        .medical-particles {
          position: fixed;
          inset: 0;
          z-index: -1;
          pointer-events: none;
          overflow: hidden;
        }
        
        .particle {
          position: absolute;
          animation: floatMed var(--duration, 12s) var(--delay, 0s) ease-in-out infinite both;
          opacity: var(--opacity, 0.3);
          font-size: var(--size, 2rem);
          filter: drop-shadow(0 0 10px rgba(0, 229, 255, 0.6));
          will-change: transform;
        }
        
        .particle:nth-child(1) { top: 10%; left: 5%;  --duration: 14s; --delay: 0s;  --size: 2.2rem; --opacity: 0.2; }
        .particle:nth-child(2) { top: 25%; right: 8%; --duration: 10s; --delay: -3s; --size: 1.5rem; --opacity: 0.4; }
        .particle:nth-child(3) { top: 55%; left: 15%; --duration: 16s; --delay: -7s; --size: 3rem;   --opacity: 0.15; }
        .particle:nth-child(4) { top: 75%; right: 12%;--duration: 12s; --delay: -2s; --size: 1.8rem; --opacity: 0.3; }
        .particle:nth-child(5) { top: 85%; left: 30%; --duration: 15s; --delay: -9s; --size: 2.5rem; --opacity: 0.25; }
        .particle:nth-child(6) { top: 40%; right: 35%;--duration: 11s; --delay: -5s; --size: 1.2rem; --opacity: 0.5; }
        
        @keyframes floatMed {
          0%   { transform: translateY(0) translateX(0) rotate(0deg) scale(1); }
          25%  { transform: translateY(-25px) translateX(15px) rotate(10deg) scale(1.1); }
          50%  { transform: translateY(-10px) translateX(-20px) rotate(-5deg) scale(0.95); }
          75%  { transform: translateY(-30px) translateX(10px) rotate(8deg) scale(1.05); }
          100% { transform: translateY(0) translateX(0) rotate(0deg) scale(1); }
        }

        /* The Pulsing Medical Cross */
        .health-card {
          position: relative;
        }
        .health-card::before,
        .health-card::after {
          content: '';
          position: absolute;
          top: 20px;
          right: 20px;
          background: var(--neon-primary);
          box-shadow: 0 0 15px var(--neon-primary);
          border-radius: 2px;
          animation: heartbeat 1.5s ease-in-out infinite;
          z-index: 10;
        }
        .health-card::before { width: 6px; height: 24px; right: 29px; }
        .health-card::after { width: 24px; height: 6px; top: 29px; }
        
        @keyframes heartbeat {
          0%, 100% { transform: scale(1); opacity: 0.8; }
          15% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 25px var(--neon-primary); }
          30% { transform: scale(1); opacity: 0.8; }
          45% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 25px var(--neon-primary); }
          60% { transform: scale(1); opacity: 0.8; }
        }

        /* EKG Sweep on Dashboards */
        .medical-dashboard {
          position: relative;
          overflow: hidden;
        }
        .medical-dashboard::after {
          content: '';
          position: absolute;
          bottom: 0;
          left: -100%;
          width: 50%;
          height: 3px;
          background: linear-gradient(to right, transparent, var(--neon-primary), transparent);
          box-shadow: 0 -2px 10px var(--neon-primary);
          animation: ekgSweep 3s linear infinite;
          z-index: 10;
        }
        
        @keyframes ekgSweep {
          0% { left: -100%; }
          100% { left: 200%; }
        }
        
        /* Inputs Fixes for Dark Theme */
        input, select, textarea {
            background: rgba(0,0,0,0.5) !important;
            border: 1px solid var(--border-neon) !important;
            color: var(--text-main) !important;
        }

</style>
</head>
<body>

    <nav class="navbar">
        <div class="navbar-logo">
            <i class="fa-solid fa-heart-pulse"></i>
            MediOps
        </div>
        <div class="flex items-center gap-4">
            <a href="/login" class="text-sm text-cyan-400 hover:text-cyan-300 transition">Back to Login</a>
            <a href="/" class="text-sm text-slate-400 hover:text-slate-200 transition flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i>
                Home
            </a>
        </div>
    </nav>

    <div class="container-auth">
        <div class="auth-box">
            <div class="auth-section">
                <div class="logo-section">
                    <div class="logo-icon">
                        <i class="fa-solid fa-user-plus"></i>
                    </div>
                    <h2>Create Account</h2>
                    <p>Join MediOps to manage your health</p>
                </div>

                <div class="status-message" id="signupStatus"></div>

                <form onsubmit="handleSignup(event)">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="signupName" placeholder="John Doe" required>
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="signupEmail" placeholder="your@email.com" required>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <div class="password-toggle">
                            <input type="password" id="signupPassword" placeholder="••••••••" required>
                            <button type="button" class="password-toggle-btn" onclick="togglePassword('signupPassword')">
                                <i class="fa-solid fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Confirm Password</label>
                        <div class="password-toggle">
                            <input type="password" id="signupConfirmPassword" placeholder="••••••••" required>
                            <button type="button" class="password-toggle-btn" onclick="togglePassword('signupConfirmPassword')">
                                <i class="fa-solid fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="remember-forgot" style="margin-bottom: 20px;">
                        <label>
                            <input type="checkbox" class="checkbox" required> I agree to Terms & Conditions
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary">Create Account</button>

                    <div class="social-login">
                        <p>Or sign up with</p>
                        <div class="social-buttons">
                            <button type="button" class="social-btn" onclick="signupWith('google')">
                                <i class="fa-brands fa-google"></i> Google
                            </button>
                            <button type="button" class="social-btn" onclick="signupWith('github')">
                                <i class="fa-brands fa-github"></i> GitHub
                            </button>
                        </div>
                    </div>
                </form>

                <div class="toggle-form">
                    Already have an account? <a href="/login">Sign in</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function togglePassword(fieldId) {
            const field = document.getElementById(fieldId);
            const isPassword = field.type === 'password';
            field.type = isPassword ? 'text' : 'password';
        }

        function handleSignup(event) {
            event.preventDefault();
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('signupConfirmPassword').value;
            const statusDiv = document.getElementById('signupStatus');

            if (password !== confirmPassword) {
                statusDiv.className = 'status-message error';
                statusDiv.textContent = '✗ Passwords do not match';
                return;
            }

            if (password.length < 6) {
                statusDiv.className = 'status-message error';
                statusDiv.textContent = '✗ Password must be at least 6 characters';
                return;
            }

            // Show loading state
            statusDiv.className = 'status-message success';
            statusDiv.textContent = '⏳ Creating account...';

            // Send request to backend
            fetch('/api/auth/signup', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    full_name: name,
                    email: email,
                    password: password,
                }),
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    statusDiv.className = 'status-message success';
                    statusDiv.textContent = '✓ Account created! Redirecting to login...';
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 1500);
                } else {
                    statusDiv.className = 'status-message error';
                    statusDiv.textContent = '✗ ' + (data.message || 'Signup failed. Please try again.');
                }
            })
            .catch(error => {
                statusDiv.className = 'status-message error';
                statusDiv.textContent = '✗ Error: ' + error.message;
            });
        }

        function signupWith(provider) {
            alert(`Signing up with ${provider}...`);
            // Implement OAuth/social signup
        }
    </script>
