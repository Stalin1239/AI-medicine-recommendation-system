<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FedMedFlow - Live Consultation</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        
        .main-video {
            flex: 1;
            background: #000;
            border-radius: 20px;
            border: 2px solid var(--primary);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
            overflow: hidden;
            position: relative;
        }
        .main-video video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .self-video {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 200px;
            height: 150px;
            background: #111;
            border-radius: 12px;
            border: 2px solid var(--secondary);
            overflow: hidden;
        }
        .self-video video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .controls {
            height: 80px;
            background: var(--bg-card);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .control-btn:hover { background: rgba(0, 240, 255, 0.2); color: var(--primary); }
        .control-btn.end-call { background: #ff0044; }
        .control-btn.end-call:hover { background: #ff3366; color: white; box-shadow: 0 0 15px rgba(255, 0, 68, 0.5); }
        
        .chat-container {
            flex: 1;
            background: var(--bg-card);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 15px;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        .message.self {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            border-bottom-right-radius: 2px;
        }
        .message.other {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.1);
            border-bottom-left-radius: 2px;
        }
        .chat-input {
            padding: 20px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
        }
        .chat-input input {
            flex: 1;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            color: white;
            outline: none;
        }
        .chat-input button {
            background: var(--primary);
            border: none;
            border-radius: 10px;
            width: 50px;
            color: #000;
            cursor: pointer;
        }
        .status-overlay {
            position: absolute;
            top: 20px; left: 20px;
            background: rgba(0,0,0,0.6);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            display: flex; align-items: center; gap: 8px;
        }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ffcc00; }
        .status-dot.connected { background: #00ff00; }
    
        
        /* DARK MEDICAL CYBERPUNK CSS GUIDE */
        :root {
          /* Deep Dark Backgrounds */
          --bg-base: #020617;       
          --bg-card: rgba(2, 6, 23, 0.7); 
          
          /* Neon Accents */
          --neon-primary: #00E5FF;  
          --neon-secondary: #0077FF; 
          
          /* Text Colors */
          --text-main: #FFFFFF;
          --text-muted: rgba(255, 255, 255, 0.5);
          
          /* Reusable Glowing Shadows (Using RGB of #00E5FF) */
          --glow-sm: 0 0 10px rgba(0, 229, 255, 0.3);
          --glow-md: 0 0 20px rgba(0, 229, 255, 0.5), 0 0 40px rgba(0, 229, 255, 0.2);
          --border-neon: rgba(0, 229, 255, 0.3);
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            position: relative;
        }

        /* Dark Moody Background Image */
        body::before {
          content: '';
          position: fixed;
          inset: 0;
          /* Using a high-quality dark medical/tech abstract image from Unsplash */
          background-image: url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?q=80&w=2070&auto=format&fit=crop');
          background-size: cover;
          background-position: center;
          
          /* CRITICAL: Darken heavily and boost colors */
          filter: brightness(0.15) saturate(1.8);
          
          z-index: -2; 
        }

        /* Subtle CRT Scanlines Overlay */
        body::after {
          content: '';
          position: fixed;
          inset: 0;
          background: repeating-linear-gradient(
            0deg,
            transparent,
            transparent 3px,
            rgba(0, 0, 0, 0.1) 3px,
            rgba(0, 0, 0, 0.1) 4px
          );
          pointer-events: none; 
          z-index: 9999;
        }

        /* Glassmorphism (Frosted Glass) for Cards */
        .glass-card, .card, .form-card, .auth-box, .sidebar, .modal-content {
          background: var(--bg-card) !important;
          backdrop-filter: blur(16px) saturate(180%) !important;
          -webkit-backdrop-filter: blur(16px) saturate(180%) !important;
          
          border: 1px solid var(--border-neon) !important;
          border-radius: 16px !important;
          box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5) !important;
          
          /* Remove clip-path from previous design */
          clip-path: none !important; 
        }

        /* Neon Glowing Text */
        .neon-heading, h1, h2, h3 {
          color: #FFF !important;
          font-weight: 800;
          text-shadow: 
            0 0 5px rgba(0, 229, 255, 0.8),
            0 0 20px rgba(0, 229, 255, 0.5),
            0 0 40px rgba(0, 229, 255, 0.3) !important;
        }

        /* Glowing Buttons */
        .cyber-button, button, .btn {
          background: transparent !important;
          color: var(--neon-primary) !important;
          border: 1px solid var(--neon-primary) !important;
          padding: 12px 24px;
          border-radius: 8px;
          text-transform: uppercase;
          letter-spacing: 2px;
          font-weight: bold;
          cursor: pointer;
          transition: all 0.3s ease;
          clip-path: none !important; /* Remove old cyberpunk clip */
        }
        
        .cyber-button:hover, button:hover, .btn:hover {
          background: var(--neon-primary) !important;
          color: var(--bg-base) !important;
          box-shadow: var(--glow-md) !important;
          transform: translateY(-2px);
          animation: none !important; /* Remove glitch */
        }

        /* Floating Medical Equipment (Particles Effect) */
        .medical-particles {
          position: fixed;
          inset: 0;
          z-index: -1;
          pointer-events: none;
          overflow: hidden;
        }
        
        .particle {
          position: absolute;
          animation: floatMed var(--duration, 12s) var(--delay, 0s) ease-in-out infinite both;
          opacity: var(--opacity, 0.3);
          font-size: var(--size, 2rem);
          filter: drop-shadow(0 0 10px rgba(0, 229, 255, 0.6));
          will-change: transform;
        }
        
        .particle:nth-child(1) { top: 10%; left: 5%;  --duration: 14s; --delay: 0s;  --size: 2.2rem; --opacity: 0.2; }
        .particle:nth-child(2) { top: 25%; right: 8%; --duration: 10s; --delay: -3s; --size: 1.5rem; --opacity: 0.4; }
        .particle:nth-child(3) { top: 55%; left: 15%; --duration: 16s; --delay: -7s; --size: 3rem;   --opacity: 0.15; }
        .particle:nth-child(4) { top: 75%; right: 12%;--duration: 12s; --delay: -2s; --size: 1.8rem; --opacity: 0.3; }
        .particle:nth-child(5) { top: 85%; left: 30%; --duration: 15s; --delay: -9s; --size: 2.5rem; --opacity: 0.25; }
        .particle:nth-child(6) { top: 40%; right: 35%;--duration: 11s; --delay: -5s; --size: 1.2rem; --opacity: 0.5; }
        
        @keyframes floatMed {
          0%   { transform: translateY(0) translateX(0) rotate(0deg) scale(1); }
          25%  { transform: translateY(-25px) translateX(15px) rotate(10deg) scale(1.1); }
          50%  { transform: translateY(-10px) translateX(-20px) rotate(-5deg) scale(0.95); }
          75%  { transform: translateY(-30px) translateX(10px) rotate(8deg) scale(1.05); }
          100% { transform: translateY(0) translateX(0) rotate(0deg) scale(1); }
        }

        /* The Pulsing Medical Cross */
        .health-card {
          position: relative;
        }
        .health-card::before,
        .health-card::after {
          content: '';
          position: absolute;
          top: 20px;
          right: 20px;
          background: var(--neon-primary);
          box-shadow: 0 0 15px var(--neon-primary);
          border-radius: 2px;
          animation: heartbeat 1.5s ease-in-out infinite;
          z-index: 10;
        }
        .health-card::before { width: 6px; height: 24px; right: 29px; }
        .health-card::after { width: 24px; height: 6px; top: 29px; }
        
        @keyframes heartbeat {
          0%, 100% { transform: scale(1); opacity: 0.8; }
          15% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 25px var(--neon-primary); }
          30% { transform: scale(1); opacity: 0.8; }
          45% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 25px var(--neon-primary); }
          60% { transform: scale(1); opacity: 0.8; }
        }

        /* EKG Sweep on Dashboards */
        .medical-dashboard {
          position: relative;
          overflow: hidden;
        }
        .medical-dashboard::after {
          content: '';
          position: absolute;
          bottom: 0;
          left: -100%;
          width: 50%;
          height: 3px;
          background: linear-gradient(to right, transparent, var(--neon-primary), transparent);
          box-shadow: 0 -2px 10px var(--neon-primary);
          animation: ekgSweep 3s linear infinite;
          z-index: 10;
        }
        
        @keyframes ekgSweep {
          0% { left: -100%; }
          100% { left: 200%; }
        }
        
        /* Inputs Fixes for Dark Theme */
        input, select, textarea {
            background: rgba(0,0,0,0.5) !important;
            border: 1px solid var(--border-neon) !important;
            color: var(--text-main) !important;
        }

</style>
</head>
<body>
    

    <div class="video-container">
        <div class="main-video">
            <div class="status-overlay">
                <div class="status-dot" id="connection-dot"></div>
                <span id="connection-status">Connecting to room...</span>
            </div>
            <video id="remoteVideo" autoplay playsinline></video>
            <div class="self-video">
                <video id="localVideo" autoplay playsinline muted></video>
            </div>
        </div>
        
        <div class="controls">
            <button class="control-btn" onclick="toggleMute()"><i class="fas fa-microphone" id="mic-icon"></i></button>
            <button class="control-btn" onclick="toggleVideo()"><i class="fas fa-video" id="vid-icon"></i></button>
            <button class="control-btn" onclick="triggerFileSelect()"><i class="fas fa-paperclip"></i></button>
            <button class="control-btn end-call" onclick="window.close()"><i class="fas fa-phone-slash"></i></button>
        </div>
    </div>

    <div class="chat-container">
        <div class="chat-header">
            <i class="fas fa-comments"></i> Live Chat & Files
        </div>
        <div class="chat-messages" id="chat-messages">
            <div class="message other">
                <em>Welcome to the secure consultation room. All messages are encrypted.</em>
            </div>
        </div>
        <div class="chat-input">
            <input type="text" id="msgInput" placeholder="Type a message..." onkeypress="handleEnter(event)">
            <input type="file" id="fileInput" style="display: none;" onchange="sendFile(event)">
            <button onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');
        
        if (!roomId) {
            alert("No room specified!");
            window.close();
        }

        let ws;
        let localStream;
        let peerConnection;
        const configuration = { 'iceServers': [{'urls': 'stun:stun.l.google.com:19302'}] };
        
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const statusText = document.getElementById('connection-status');
        const statusDot = document.getElementById('connection-dot');

        async function init() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = localStream;
                
                // Connect WebSocket
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                ws = new WebSocket(`${protocol}//${window.location.host}/ws/consultation/${roomId}`);
                
                ws.onopen = () => {
                    statusText.textContent = "Waiting for peer...";
                    // Initiator sends offer
                    createPeerConnection();
                    // Just wait for other peer or send an offer blindly.
                    // We'll broadcast a 'join' event.
                    ws.send(JSON.stringify({ type: 'join' }));
                };
                
                ws.onmessage = async (event) => {
                    const message = JSON.parse(event.data);
                    
                    if (message.type === 'join') {
                        // Someone joined, we should send an offer if we are the "caller"
                        createOffer();
                    } else if (message.type === 'offer') {
                        if (!peerConnection) createPeerConnection();
                        await peerConnection.setRemoteDescription(new RTCSessionDescription(message.offer));
                        const answer = await peerConnection.createAnswer();
                        await peerConnection.setLocalDescription(answer);
                        ws.send(JSON.stringify({ type: 'answer', answer: answer }));
                    } else if (message.type === 'answer') {
                        await peerConnection.setRemoteDescription(new RTCSessionDescription(message.answer));
                    } else if (message.type === 'ice-candidate') {
                        if (peerConnection) {
                            await peerConnection.addIceCandidate(new RTCIceCandidate(message.candidate));
                        }
                    } else if (message.type === 'chat') {
                        appendMessage(message.text, 'other');
                    } else if (message.type === 'file') {
                        appendFile(message.filename, message.filedata, 'other');
                    }
                };
            } catch (e) {
                console.error("Error accessing media devices.", e);
                statusText.textContent = "Camera/Mic access denied";
            }
        }

        function createPeerConnection() {
            peerConnection = new RTCPeerConnection(configuration);
            
            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });
            
            peerConnection.ontrack = event => {
                remoteVideo.srcObject = event.streams[0];
                statusText.textContent = "Connected (Encrypted)";
                statusDot.classList.add('connected');
            };
            
            peerConnection.onicecandidate = event => {
                if (event.candidate) {
                    ws.send(JSON.stringify({ type: 'ice-candidate', candidate: event.candidate }));
                }
            };
        }

        async function createOffer() {
            if (!peerConnection) createPeerConnection();
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            ws.send(JSON.stringify({ type: 'offer', offer: offer }));
        }

        // --- UI Controls ---
        
        let isMuted = false;
        function toggleMute() {
            isMuted = !isMuted;
            localStream.getAudioTracks()[0].enabled = !isMuted;
            document.getElementById('mic-icon').className = isMuted ? 'fas fa-microphone-slash' : 'fas fa-microphone';
        }

        let isVideoOff = false;
        function toggleVideo() {
            isVideoOff = !isVideoOff;
            localStream.getVideoTracks()[0].enabled = !isVideoOff;
            document.getElementById('vid-icon').className = isVideoOff ? 'fas fa-video-slash' : 'fas fa-video';
        }

        // --- Chat & Files ---

        function appendMessage(text, side) {
            const msgs = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = `message ${side}`;
            div.textContent = text;
            msgs.appendChild(div);
            msgs.scrollTop = msgs.scrollHeight;
        }

        function appendFile(filename, dataUrl, side) {
            const msgs = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = `message ${side}`;
            div.innerHTML = `<i class="fas fa-file"></i> <a href="${dataUrl}" download="${filename}" style="color:inherit;">${filename}</a>`;
            msgs.appendChild(div);
            msgs.scrollTop = msgs.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (text) {
                appendMessage(text, 'self');
                ws.send(JSON.stringify({ type: 'chat', text: text }));
                input.value = '';
            }
        }

        function handleEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function triggerFileSelect() {
            document.getElementById('fileInput').click();
        }

        function sendFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                const dataUrl = e.target.result;
                appendFile(file.name, dataUrl, 'self');
                ws.send(JSON.stringify({
                    type: 'file',
                    filename: file.name,
                    filedata: dataUrl
                }));
            };
            reader.readAsDataURL(file);
        }

        // Start
        window.onload = init;
    </script>
</body>
</html>
