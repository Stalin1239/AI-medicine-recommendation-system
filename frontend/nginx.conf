server {
    listen 80;
    server_name localhost;

    # Root directory where static files reside
    root /usr/share/nginx/html;
    index index.html;

    # Static UI Page routings
    location = / {
        try_files /static/index.html =404;
    }

    location = /login {
        try_files /static/login.html =404;
    }

    location = /signup {
        try_files /static/signup.html =404;
    }

    location = /dashboard {
        try_files /static/dashboard.html =404;
    }

    location = /doctor-dashboard {
        try_files /static/doctor-dashboard.html =404;
    }

    location = /doctor/login {
        try_files /static/doctor-login.html =404;
    }

    location = /doctor-login {
        try_files /static/doctor-login.html =404;
    }

    location = /consultation-request {
        try_files /static/consultation-request.html =404;
    }

    location = /diagnosis-interface {
        try_files /static/diagnosis-interface.html =404;
    }

    location = /video-room {
        try_files /static/video-room.html =404;
    }

    location = /admin {
        try_files /static/admin-panel.html =404;
    }

    # Serve static assets (CSS, JS, media files)
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 7d;
        access_log off;
    }

    # Reverse proxy API endpoints to backend FastAPI service
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy triage socket / endpoint
    location /triage {
        proxy_pass http://backend:8000/triage;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Custom 404 page
    error_page 404 /static/index.html;
}
